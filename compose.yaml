services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - whatsapp
    restart: unless-stopped
  web:
    profiles: ["local"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Urls: http://+:5000
      ConnectionStrings__Crm: Data Source=/app/data/crm.db
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
      WhatsApp__Url: http://whatsapp:3001
      WhatsApp__Secret: ${SERVICE_SECRET:?Defina SERVICE_SECRET no .env}
      SecureCookies: ${SECURE_COOKIES:-true}
    expose:
      - "5000"
    volumes:
      - crm_data:/app/data
    restart: unless-stopped
  whatsapp:
    build:
      context: .
      dockerfile: apps/whatsapp/Dockerfile
    environment:
      PORT: "3001"
      SERVICE_SECRET: ${SERVICE_SECRET:?Defina SERVICE_SECRET no .env}
      CRM_API_URL: http://api:5000
    expose:
      - "3001"
    volumes:
      - whatsapp_data:/repo/apps/whatsapp/data
    restart: unless-stopped
volumes:
  crm_data:
  whatsapp_data:
  caddy_data:
  caddy_config:
